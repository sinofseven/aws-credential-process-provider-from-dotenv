[package]
name = "aws-credential-process-provider-from-dotenv"
version = "0.2.0"
edition = "2024"
description = "AWS credential provider from .env files for AWS CLI credential_process"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["cargo"] }
dotenvy = { git = "https://github.com/allan2/dotenvy.git", rev = "cf125ddeb263c234ad83a46e5d4115b53888f24f" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
redis = "1.2.2"
dirs = "6.0.0"
toml = "1.0.0"
shellexpand = "3.1.2"
